# content/learn/sources.yaml
#
# Every lesson in content/learn/**/*.md names one of these ids in its
# `source_id` front matter field. The Learn engine renders an attribution
# footer from this file automatically — do not hand-write attribution text
# in lesson bodies.
#
# Licensing rules this file enforces:
#   - CFPB / FDIC: US federal government works, public domain. Cite, never reproduce logos.
#   - OpenStax: 1st edition ONLY. 2nd edition is forbidden and must never be added here.
#   - Wikipedia: CC BY-SA — must be marked as such wherever used.
#   - Bogleheads: licence unverified — deliberately NOT included in this file. No lesson in
#     M0-M2 cites Bogleheads; if a future module wants it, write original prose and link out,
#     never copy a sentence, and do not set allows_verbatim: true for it.

sources:
