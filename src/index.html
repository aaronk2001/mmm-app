<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMM</title>
  <script>
    // No-flash theme boot: set data-theme / data-density + base bg before paint.
    (function () {
      try {
        var pref = localStorage.getItem('mmm-theme') || 'dark';
        var t = (pref === 'system')
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        var de = document.documentElement;
        de.setAttribute('data-theme', t);
        de.setAttribute('data-density', localStorage.getItem('mmm-density') || 'comfortable');
        de.style.colorScheme = t;
        de.style.backgroundColor = (t === 'dark') ? '#0f1115' : '#f4f5f7';
        // Retire the pre-teal blue accents so MMM's identity shows; a
        // deliberately-picked accent still persists.
        var a = localStorage.getItem('mmm-accent');
        if (a === '#0071e3' || a === '#2f86ff') { localStorage.removeItem('mmm-accent'); a = null; }
        if (a) de.style.setProperty('--accent', a);
      } catch (e) {}
    })();
  </script>
  <style>html, body { margin: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
