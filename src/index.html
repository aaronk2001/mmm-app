<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMM</title>
  <script>
    // No-flash theme boot: set data-theme / data-density + base bg before paint.
    (function () {
      try {
        var pref = localStorage.getItem('mmm-theme') || 'system';
        var t = (pref === 'system')
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        var de = document.documentElement;
        de.setAttribute('data-theme', t);
        de.setAttribute('data-density', localStorage.getItem('mmm-density') || 'comfortable');
        de.style.colorScheme = t;
        de.style.backgroundColor = (t === 'dark') ? '#0b0e14' : '#f6f7f9';
        var a = localStorage.getItem('mmm-accent');
        if (a) de.style.setProperty('--accent', a);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>html, body { margin: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
